site_name: wiki-ICM
site_description: Material de estudio para la carrera de Ingeniería Civil Matemática.
site_url: https://wiki-icm.github.io/


nav:
  - Inicio: index.md
  - Primer Año :
      - Malla 2021: a121.md
      - Malla 2025: a125.md
  - Segundo Año : a2.md
  - Tercer Año : a3.md
  - Cuarto Año : a4.md
  - Quinto Año : a5.md
  - Sexto Año : a6.md
  - Electivos: electivos/index.md

  - Material complementario: ot.md
  

theme: 
  name: material
  language: es
  palette:
    primary: custom
  logo: assets/logof.png
  favicon: assets/logof.png
  features:
    - navigation.instant.preview
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tabs
    - navigation.tracking
    - toc.integrate
    - navigation.top


markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:      
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - htmlproofer:
      raise_error: true
      validate_external_urls: true
  - meta-descriptions:
      min_length: 50
      max_length: 160
      trim: true
      fallback_if_short: true
  - social:
      cards_layout_options:
        background_color: "#a2b8fc"
        
extra_css:
  - extra.css